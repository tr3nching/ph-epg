name: Mirror consolidated EPG for existing clients

on:
  schedule:
    - cron: '25,55 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Copy published guide without rebuilding
        run: |
          mkdir -p dist
          for asset in epg.xml epg.xml.gz epg-status.json report.txt; do
            curl --fail --location --retry 2 --max-time 60 "https://tr3nching.github.io/ph-tv-playlist/$asset" --output "dist/$asset"
          done
          cat > dist/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>PH EPG has moved</title><h1>PH EPG</h1><p>The playlist and EPG builders are now in <a href="https://github.com/tr3nching/ph-tv-playlist">ph-tv-playlist</a>.</p><p><a href="https://tr3nching.github.io/ph-tv-playlist/playlist-combined.m3u">Combined playlist with automatic EPG</a></p><p><a href="epg.xml.gz">Compatibility guide mirror</a></p>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish compatibility mirror
        id: deployment
        uses: actions/deploy-pages@v5
